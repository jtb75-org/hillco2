server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Landing is a single static page. Anything that isn't a real file
    # falls back to index.html so the React app shows the marketing
    # page and (when present) the ?login_error= banner. /api/*, /auth/*,
    # and /app/* never reach this container — Traefik routes those at
    # ingress-level.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
