server {
    # 8080 because the image is nginx-unprivileged (runs as uid 101,
    # can't bind <1024). The k8s Service maps to this via targetPort.
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA is served at the root of its own host (app.hillcoeducation.com);
    # the ingress routes /api/*, /auth/*, /health, etc. to the backend before
    # they ever reach this container.

    # Hashed asset bundles get long-lived caching; index.html stays short
    # so a deploy is picked up on the user's next page load.
    location ~* \.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — any path that isn't a real file falls back to
    # index.html so react-router (basename = /) handles client-side routing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
