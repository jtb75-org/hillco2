server {
    # 8080 because the image is nginx-unprivileged (runs as uid 101,
    # can't bind <1024). The k8s Service maps to this via targetPort.
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /app is the bare prefix without trailing slash — bounce to /app/
    # so the SPA's relative asset URLs resolve correctly.
    location = /app { return 302 /app/; }

    # Hashed asset bundles get long-lived caching; index.html stays short
    # so a deploy is picked up on the user's next page load.
    location ~* ^/app/.+\.(?:js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /app/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback under /app — any path beneath /app/ that isn't a
    # real file falls back to /app/index.html so react-router (basename
    # = /app) handles client-side routing. /api/*, /auth/*, and /
    # never reach this container — Traefik routes those at the ingress
    # to the backend or landing tier.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }
}
