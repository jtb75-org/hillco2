[alembic]
script_location = alembic

# Migration filename template — date prefix groups chronologically when
# someone scans `alembic/versions/`, slug surfaces the intent.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s_%%(rev)s

# sqlalchemy.url is intentionally empty here; env.py reads DATABASE_URL
# from os.environ at runtime. Configparser-style %(VAR)s interpolation
# would work but is harder to override per-environment cleanly.
sqlalchemy.url =

# Log only what's worth seeing in the bootstrap-Job logs by default.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
