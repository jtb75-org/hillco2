name: Build and Push

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Per-ref concurrency. cancel-in-progress is conditional:
#   - PR events: cancel older runs on the same PR when a new commit
#     arrives. PR validation should track the latest commit, not waste
#     cycles on stale ones.
#   - main pushes: don't cancel — each main commit's image should be
#     built and deployed, not canceled mid-build because a fresher one
#     arrived. Builds queue instead. (Two close-together pushes both
#     checkout gitops and edit the same kustomization.yaml; the queue
#     prevents non-fast-forward push races on the gitops repo.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: zot.lan.ng20.org
  IMAGE_NAME: hillco2

jobs:
  lint:
    name: Lint (ruff)
    runs-on: jtb75-arc
    container:
      # In-repo builder image, pinned by digest. ruff is baked in;
      # the previous atlas/builder + curl-install dance is gone.
      # Bump the digest in lockstep with Dockerfile.builder changes
      # — a Dockerfile.builder PR rebuilds and prints a new sha256.
      image: zot.lan.ng20.org/hillco2-builder@sha256:11c35fca4153f628ab6451623a32f89ed6dddddb4a2a9da57c1690f201cf50aa
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ruff
        run: ruff check .

  test:
    name: Tests (pytest)
    runs-on: jtb75-arc
    # Independent of lint — they share no artifacts and the test job
    # has its own postgres service. Running side-by-side trades the
    # ~15s fail-fast on lint errors for ~15s shorter happy-path CI;
    # for a 32s test job that's worth it.
    container:
      image: python:3.12-slim
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgresql:16.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hillco2_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test deps
        # weasyprint is in requirements.txt but lazy-imported inside the
        # PDF endpoint, so tests don't need libpango/libcairo at runtime.
        # If the test suite ever exercises PDF rendering, add the apt-get
        # libpango/libcairo install here.
        run: |
          pip install --no-cache-dir -r requirements-test.txt

      - name: Run pytest
        env:
          # ARC k8s-mode runners share localhost between the job container
          # and service containers (same pod), so the service name
          # `postgres` doesn't resolve — use localhost instead.
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/hillco2_test
        run: pytest -v --tb=short

  e2e:
    name: E2E (Playwright)
    runs-on: jtb75-arc
    container:
      image: node:20-bookworm
    services:
      postgres:
        image: ghcr.io/cloudnative-pg/postgresql:16.4
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: hillco2_test
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python test deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --no-cache-dir -r requirements-test.txt

      - name: Install SPA deps
        working-directory: spa
        run: npm ci --no-audit --no-fund

      - name: Run Playwright smoke test
        working-directory: spa
        env:
          # ARC k8s-mode runners share localhost between the job container
          # and service containers (same pod), so use localhost here too.
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/hillco2_test
          E2E_PYTHON: .venv/bin/python
        run: npm run e2e:ci

  build:
    name: Build, push, and bump gitops
    runs-on: jtb75-arc
    needs: [lint, test, e2e]
    # Build only on the merged commit; PRs run lint + test only. Building
    # PR commits would push throwaway image tags to zot and try to bump
    # the gitops overlay before merge, which we explicitly don't want.
    if: github.event_name != 'pull_request'
    container:
      # Same builder image atlas/hillco-portal use: alpine + kaniko at
      # /opt/kaniko/executor (node20 also present but unused here).
      image: zot.lan.ng20.org/atlas/builder:latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get short SHA
        id: sha
        run: |
          short=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "short=${short}" >> "$GITHUB_OUTPUT"
          echo "Short SHA: ${short}"

      - name: Configure registry auth (kaniko)
        env:
          ZOT_USERNAME: ${{ secrets.ZOT_USERNAME }}
          ZOT_PASSWORD: ${{ secrets.ZOT_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "${ZOT_USERNAME}" "${ZOT_PASSWORD}" | base64 | tr -d '\n')
          CONFIG=$(printf '{"auths":{"%s":{"auth":"%s"}}}' "${REGISTRY}" "${AUTH}")
          mkdir -p /opt/kaniko/.docker /root/.docker "${HOME:-/root}/.docker"
          printf '%s\n' "${CONFIG}" > /opt/kaniko/.docker/config.json
          printf '%s\n' "${CONFIG}" > /root/.docker/config.json
          printf '%s\n' "${CONFIG}" > "${HOME:-/root}/.docker/config.json"

      - name: Build SPA bundle (outside Docker)
        # Same convention hillco-portal used for Tailwind: build assets
        # outside the Dockerfile so kaniko sees a single-stage build
        # (multi-stage kaniko has known push-auth bugs). The atlas/builder
        # image ships node20 + corepack.
        working-directory: spa
        run: |
          npm ci --no-audit --no-fund
          npm run build
          ls -la dist/

      - name: Build and push web image with kaniko
        run: |
          /opt/kaniko/executor \
            --context="${GITHUB_WORKSPACE}" \
            --dockerfile="${GITHUB_WORKSPACE}/Dockerfile" \
            --destination="${REGISTRY}/${IMAGE_NAME}:${{ steps.sha.outputs.short }}" \
            --destination="${REGISTRY}/${IMAGE_NAME}:main-latest" \
            --build-arg="BUILD_COMMIT=${{ steps.sha.outputs.short }}" \
            --snapshot-mode=redo

      - name: Build and push SPA image with kaniko
        run: |
          /opt/kaniko/executor \
            --context="${GITHUB_WORKSPACE}" \
            --dockerfile="${GITHUB_WORKSPACE}/spa/Dockerfile" \
            --destination="${REGISTRY}/${IMAGE_NAME}-spa:${{ steps.sha.outputs.short }}" \
            --destination="${REGISTRY}/${IMAGE_NAME}-spa:main-latest" \
            --build-arg="BUILD_COMMIT=${{ steps.sha.outputs.short }}" \
            --snapshot-mode=redo

      - name: Checkout hillco2-gitops
        uses: actions/checkout@v4
        with:
          repository: jtb75-org/hillco2-gitops
          token: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          path: hillco2-gitops
          persist-credentials: true

      - name: Update both image tags in gitops
        working-directory: hillco2-gitops/overlays/onprem
        env:
          NEW_TAG: ${{ steps.sha.outputs.short }}
        run: |
          # End-of-line anchor on the first sed so `/hillco2` doesn't also
          # match `/hillco2-spa`. Quote newTag so all-digit short SHAs
          # don't parse as YAML ints.
          sed -i "/name: ${REGISTRY}\/${IMAGE_NAME}\$/,/newTag:/ s|newTag: .*|newTag: \"${NEW_TAG}\"|" kustomization.yaml
          sed -i "/name: ${REGISTRY}\/${IMAGE_NAME}-spa\$/,/newTag:/ s|newTag: .*|newTag: \"${NEW_TAG}\"|" kustomization.yaml
          echo "Updated kustomization.yaml:"
          grep -A1 "name: ${REGISTRY}/${IMAGE_NAME}" kustomization.yaml || true

      - name: Commit and push to hillco2-gitops
        working-directory: hillco2-gitops
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          NEW_TAG: ${{ steps.sha.outputs.short }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITOPS_TOKEN}@github.com/jtb75-org/hillco2-gitops.git"

          git add overlays/onprem/kustomization.yaml

          if git diff --staged --quiet; then
            echo "No image tag changes to commit"
          else
            git commit -m "deploy: hillco2 + spa ${NEW_TAG}"
            git push origin main
          fi
